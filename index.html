<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>STAR TREK ORIGINAL SERIES THEME MONTH!</title>
  <style>
    * { box-sizing: border-box; }
    
    html, body { 
      margin: 0; 
      color: #fff;
      font-family: Georgia, 'Times New Roman', serif; 
      transition: background 0.5s ease-in-out;
      overflow-x: hidden;
    }
    
    body { 
      padding: 6px; 
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      /* Starfield CSS Wallpaper Pattern */
      background-color: #110e14;
      background-image: 
        radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
        radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
        radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
      background-size: 550px 550px, 350px 350px, 250px 250px;
      background-position: 0 0, 40px 60px, 130px 270px;
    }

    /* --- Lights Out / Dimmed Wallpaper State --- */
    body.lights-out {
      background-color: #050406 !important;
      background-image: none !important;
    }
    
    body.lights-out .marquee {
      filter: brightness(0.35) contrast(1.1);
    }

    /* --- Ejecting / Warp Out State --- */
    body.warp-out .marquee {
      animation: warpDrive 0.8s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
    }

    @keyframes warpDrive {
      0% { transform: translateX(0) scaleY(1); opacity: 1; }
      30% { transform: translateX(-5%) scaleY(1.02); opacity: 1; filter: brightness(2); }
      100% { transform: translateX(150%) scaleX(2); opacity: 0; filter: blur(10px); }
    }

    /* --- Marquee Header Component --- */
    .marquee {
      position: relative;
      width: 120%;
      height: clamp(180px, 28vw, 310px);
      clip-path: polygon(0 12px, 12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px));
      border: 4px solid #f6d678;
      box-shadow: inset 0 0 0 3px #6339;
      background: #090609;
      margin-bottom: 30px;
      transition: filter 0.5s ease, transform 0.5s ease;
    }
    
    .marquee:before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 2px solid #f8da7c;
      pointer-events: none;
      z-index: 10;
      box-shadow: inset 0 0 12px #d48b2b;
    }
    
    .rail {
      position: absolute;
      inset: 0;
      display: flex;
      width: 300%;
      transform: translateX(-33.333333%);
      will-change: transform;
    }
    
    .panel {
      width: 33.333333%;
      height: 100%;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    
    .center {
      background: radial-gradient(ellipse at center, #3d1117 0%, #14080c 68%, #080508 100%);
    }
    
    .center .text {
      position: relative;
      text-align: center;
      z-index: 2;
      padding: 10px 28px;
    }
    
    .center h1 {
      margin: 0;
      color: #ff2929;
      font-size: clamp(32px, 7.5vw, 91px);
      line-height: .99;
      letter-spacing: .035em;
      -webkit-text-stroke: 1px #f8d88a;
      text-shadow: 0 2px 0 #4e2104, 0 0 6px #ff4734, 0 0 17px #ed001c, 0 0 32px #c6001c;
    }

    .center p {
      margin: 8px 0 0 0;
      font-size: clamp(14px, 2.2vw, 24px);
      letter-spacing: .08em;
      color: #ffb834;
      text-shadow: 0 1px 0 #570000, 0 0 8px #ff4d00;
    }

    /* --- Content Area Layout --- */
    .main-content {
      flex: 1;
      position: relative;
      padding: 20px;
    }

    /* --- Ornamental Right-Hand Flip-Flop Switch --- */
    .vintage-switch-box {
      position: absolute;
      top: 10px;
      right: 20px;
      width: 120px;
      height: 120px;
      cursor: pointer;
      user-select: none;
      z-index: 30;
      transition: transform 0.1s ease;
    }

    .vintage-switch-box:active {
      transform: scale(0.95);
    }

    .vintage-switch-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.2s ease-in-out;
    }

    .vintage-switch-box.flipped .vintage-switch-img {
      transform: scaleY(-1);
    }

    /* --- Media Overlay Container (For short MP4 clips) --- */
    .media-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .media-overlay video {
      max-width: 80%;
      max-height: 80%;
      border: 4px solid #f6d678;
      box-shadow: 0 0 30px rgba(255, 41, 41, 0.6);
    }

    /* --- Image List Structure / Target Poster Rules --- */
    .image-container-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    .poster-item {
      width: 100%;
      border: 3px solid #633909;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .poster-item.flipped-target {
      transform: rotateY(180deg) scale(0.95);
    }

    /* --- Console Controls Layout --- */
    .control-deck {
      display: flex;
      gap: 40px;
      align-items: center;
      justify-content: center;
      margin-top: auto;
      padding: 30px 0;
      background: linear-gradient(transparent, rgba(20, 16, 24, 0.85));
      z-index: 20;
    }

    .switch-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .switch-label {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #f8da7c;
      margin-bottom: 10px;
      font-family: sans-serif;
      font-weight: bold;
      user-select: none;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
    }

    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #3d1117;
      border: 2px solid #633909;
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 4px;
      bottom: 4px;
      background-color: #f8da7c;
      box-shadow: 0 0 8px #ff4d00;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #ff2929;
      border-color: #f8da7c;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
      background-color: #fff;
      box-shadow: 0 0 12px #ff4734;
    }

    .eject-system .slider {
      background-color: #222;
      border-color: #444;
    }
    .eject-system .slider:before {
      background-color: #888;
      box-shadow: none;
    }
    .eject-system input:checked + .slider {
      background-color: #ffaa00;
      border-color: #ffea00;
    }
    .eject-system input:checked + .slider:before {
      box-shadow: 0 0 12px #ffaa00;
    }
  </style>
</head>
