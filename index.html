<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quote Challenge | Theater 7.0</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#03050b;color:#fff;font-family:system-ui,Arial,sans-serif}
body{padding-bottom:24px}
.theater{position:relative;width:100%;max-width:1648px;aspect-ratio:1648/928;margin:0 auto;background:url('file_00000000edac81f5a897ec15c9dd5d18.png') center/100% 100% no-repeat;overflow:hidden}
.marquee{position:absolute;left:24.2%;top:24.4%;width:51.8%;height:12.5%;overflow:hidden;display:grid;place-items:center;isolation:isolate;background:radial-gradient(ellipse at center,#17356d,#07132e 75%);border-top:2px solid #d89524;border-bottom:2px solid #d89524;box-shadow:0 0 24px #e5b84955,inset 0 0 20px #000}
.marquee:before{content:"";position:absolute;inset:5px;border:1px solid #ffe5a588;border-radius:9px;pointer-events:none;z-index:5}
.marquee:after{content:"";position:absolute;inset:-28%;z-index:0;pointer-events:none;opacity:.27;background:repeating-linear-gradient(101deg,transparent 0 30px,#ffc76a12 37px,transparent 51px 82px),radial-gradient(ellipse at 38% 65%,#ff8b3d18,transparent 53%),radial-gradient(ellipse at 72% 38%,#a74bff20,transparent 55%);filter:blur(12px);animation:heatDrift 8s ease-in-out infinite alternate}
@keyframes heatDrift{0%{transform:translate(-1.5%,2%) skewX(-2deg) scale(1.02)}50%{transform:translate(1%,-1.5%) skewX(2deg) scale(1.06)}100%{transform:translate(-.5%,1%) skewX(-1deg) scale(1.03)}}
.wave-message{position:relative;z-index:2;text-align:center;padding:0 8px;font-size:clamp(10px,2.8vw,42px);font-weight:bold;letter-spacing:.015em;color:#fff5b8;text-shadow:0 2px 2px #241000,0 0 6px #ffb742,0 0 14px #fff3;transition:opacity .12s ease}
.wave-message.hide{opacity:0}
.door-link{position:absolute;display:block;top:43.3%;height:43.8%;z-index:2;cursor:pointer;border-radius:5px}
.door-one{left:32.5%;width:14.4%}.door-two{left:52.9%;width:13.8%}
.door-link:focus-visible{outline:3px solid #fff39b;outline-offset:2px}
.below-stage{width:min(1500px,96%);margin:18px auto 0;display:grid;grid-template-columns:minmax(180px,250px) minmax(0,1fr);gap:16px;align-items:stretch}
.navigation,.viewer-panel{min-width:0;border:1px solid #d6a54e88;border-radius:12px;background:linear-gradient(145deg,#101b30,#070b14 72%);box-shadow:0 8px 28px #0009,inset 0 1px #ffffff12}
.navigation{padding:18px}
.navigation h2,.viewer-panel h2{margin:0 0 12px;color:#ffdf84;font-size:20px}
.navigation p{margin:0 0 14px;color:#c8d1e4;font-size:14px;line-height:1.5}
.nav-links{display:grid;gap:10px}
.nav-links a{display:block;padding:12px 14px;border:1px solid #d6a54e88;border-radius:8px;background:#111a2b;color:#ffe7a0;text-decoration:none;font-weight:700;transition:background .18s ease,transform .18s ease,border-color .18s ease}
.nav-links a:hover,.nav-links a:focus-visible{background:#263451;border-color:#ffe083;transform:translateX(2px)}
.nav-links a:focus-visible{outline:3px solid #fff;outline-offset:2px}
.viewer-panel{display:flex;flex-direction:column;padding:16px;min-height:620px}
.viewer-panel h2{margin-bottom:10px}
.viewer-panel iframe{display:block;flex:1;width:100%;min-height:560px;border:1px solid #4d5b75;border-radius:8px;background:#03050b}
@media(max-width:700px){.below-stage{grid-template-columns:1fr;margin-top:12px}.navigation{padding:14px}.nav-links{grid-template-columns:repeat(2,minmax(0,1fr))}.viewer-panel{min-height:520px;padding:12px}.viewer-panel iframe{min-height:460px}}
@media(max-width:420px){.nav-links{grid-template-columns:1fr}.viewer-panel{min-height:440px}.viewer-panel iframe{min-height:380px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main>
  <section class="theater" aria-label="Quote Challenge theater entrance">
    <div class="marquee" aria-label="Animated Quote Challenge welcome messages"><div class="wave-message" id="waveMessage">WELCOME TO QUOTE CHALLENGE</div></div>
    <a class="door-link door-one" href="one-player.html" target="mainViewer" aria-label="Open one-player game in the main viewing panel" title="ADMIT ONE"></a>
    <a class="door-link door-two" href="two-player.html" target="mainViewer" aria-label="Open two-player game in the main viewing panel" title="ADMIT TWO"></a>
  </section>
  <div class="below-stage">
    <nav class="navigation" aria-label="Site pages">
      <h2>Choose a feature</h2>
      <p>Select a link to show it in the viewing panel.</p>
      <div class="nav-links">
        <a href="one-player.html" target="mainViewer">One-player challenge</a>
        <a href="two-player.html" target="mainViewer">Two-player challenge</a>
        <a href="home-panel.html" target="mainViewer">Home</a>
      </div>
    </nav>
    <section class="viewer-panel" aria-labelledby="viewerTitle">
      <h2 id="viewerTitle">Main viewing area</h2>
      <iframe name="mainViewer" title="Selected Quote Challenge page" src="home-panel.html"></iframe>
    </section>
  </div>
</main>
<script>
const slides=[
  {text:"WELCOME TO QUOTE CHALLENGE 7.0 LOGAN'S RUN!",hold:4000},
  {text:'WE WISH YOU A HAPPY HOLIDAY SEASON',hold:4000},
  {text:'QC AND LOGANS RUN ALL DECEMBER 2026!',hold:7000}
];
const message=document.getElementById('waveMessage');
let slideIndex=0;
function showNextSlide(){
  message.classList.add('hide');
  window.setTimeout(()=>{
    slideIndex=(slideIndex+1)%slides.length;
    message.textContent=slides[slideIndex].text;
    message.classList.remove('hide');
    window.setTimeout(showNextSlide,slides[slideIndex].hold);
  },120);
}
window.setTimeout(showNextSlide,slides[0].hold);
</script>
</body>
</html>
