    * { box-sizing: border-box; }
    body { margin: 0; background: #100d12; color: #fff; font-family: Georgia, serif; transition: background 0.5s ease; }
    
    /* Active Light Switch Dimming Overlays */
    body.lights-off { background: #020103; }
    body.lights-off .gallery-container { opacity: 0.15; filter: blur(2px); pointer-events: none; transition: all 0.6s ease; }
    body.lights-off .switch-footer { background: rgba(0,0,0,0.9); }
    body.lights-off .antique-toggle { filter: drop-shadow(0 0 12px #f3ce67) brightness(1.2); }

    /* Upper Stage Header Frame Area */
    .marquee-area { padding: 24px 16px 12px; background: radial-gradient(ellipse at 50% 0%, #401018, #09080d 75%); }
    .wrap { width: min(750px, 100%); margin: auto; }
    .label { text-align: center; color: #e9c680; letter-spacing: .12em; font: 13px system-ui; margin-bottom: 14px; }
    .stage { position: relative; overflow: hidden; aspect-ratio: 3.4/1; min-height: 220px; border: 9px ridge #ad7930; box-shadow: 0 0 0 3px #ffe2a0, 0 0 30px #bd6c16, inset 0 0 30px #000; background: #150f19; margin-bottom: 30px; }
    .bulbs { position: absolute; inset: 0; pointer-events: none; z-index: 3; border: 12px dotted #ffe4a2; filter: drop-shadow(0 0 6px #f7ac29); }
    
    /* Sliding 3-Panel Content Deck Window */
    .track { height: 100%; display: flex; width: 300%; transform: translateX(-33.333%); transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1); }
    .panel { flex: 0 0 33.333%; height: 100%; display: grid; place-items: center; position: relative; overflow: hidden; }
    
    /* Panel Specific Background Variations */
    .poster-left { background: linear-gradient(135deg, #1c352d, #081410 60%, #2e441a); }
    .title { background: radial-gradient(ellipse, #42131a, #120b14 70%); }
    .poster-right { background: linear-gradient(135deg, #1a2844, #0a101c 60%, #48212a); }
    
    .panel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #080b13; }
    .poster-copy { position: relative; text-align: center; padding: 15px; text-shadow: 0 3px 10px #000, 0 0 15px #000; z-index: 2; }
    .poster-copy strong { display: block; font-size: clamp(22px, 5vw, 55px); color: #ffdc91; line-height: 1.1; }
    .poster-copy span { font: clamp(11px, 1.8vw, 18px) system-ui; color: #fff; display: block; margin-bottom: 4px; }
    .poster-copy em { display: block; font-size: clamp(12px, 2.2vw, 24px); margin-top: 6px; color: #d9efff; font-style: normal; font-weight: bold; }
    .title h1 { margin: 0; text-align: center; font-size: clamp(34px, 7vw, 75px); line-height: 1.05; letter-spacing: .04em; color: #f3ce67; text-shadow: 0 2px #4a2206, 0 0 14px #f43d26, 0 0 36px #b50c20; }
    .title small { font: clamp(10px, 1.6vw, 19px) system-ui; letter-spacing: .2em; color: #fff0c0; }

    /* Interactive Picture Gallery Assembly */
    .gallery-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; transition: all 0.5s ease; }
    .hanging-frame { background: #1a141f; border: 4px ridge #ad7930; border-radius: 4px; overflow: hidden; aspect-ratio: 2/3; cursor: pointer; position: relative; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
    .hanging-frame:hover, .hanging-frame:focus { transform: translateY(-4px); box-shadow: 0 12px 24px #bd6c16; outline: none; }
    .hanging-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
    
    /* Missing Image File Error Boundaries */
    .hanging-frame.missing { border-color: #5a1818; cursor: default; display: flex; align-items: center; justify-content: center; padding: 15px; text-align: center; }
    .hanging-frame.missing:hover { transform: none; box-shadow: none; }
    .hanging-frame.missing img { display: none; }
    .missing-label { font: 12px system-ui; color: #ff9999; word-break: break-all; }

    /* Mechanical Light Switch Footer Layout */
    .switch-footer { padding: 30px 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.3); margin-top: 40px; border-top: 1px dashed rgba(173, 121, 48, 0.3); transition: background 0.5s; }
    .antique-toggle-container { position: relative; width: 120px; height: 120px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    .antique-toggle { width: 100%; height: 100%; object-fit: contain; transition: transform 0.15s ease, filter 0.3s; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6)); }
    .antique-toggle-container:active .antique-toggle { transform: scale(0.94); }
    .switch-caption { font: 11px system-ui; color: #ad7930; letter-spacing: 0.15em; margin-top: 8px; text-transform: uppercase; }

    /* Lightbox Modal Window Backdrop */
    .viewer { border: 6px ridge #ad7930; background: #08050a; color: #fff; padding: 0; max-width: 90vw; max-height: 90vh; border-radius: 8px; box-shadow: 0 0 50px rgba(0,0,0,0.8); overflow: hidden; }
    .viewer::backdrop { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px); }
    .viewer img { display: block; max-width: 100%; max-height: 80vh; object-fit: contain; margin: 0 auto; }
    .viewer .close { position: absolute; top: 12px; right: 12px; background: #ad792f; color: #100b0d; border: 0; padding: 6px 12px; font: bold 14px system-ui; border-radius: 4px; cursor: pointer; z-index: 10; }
    .viewer .close:hover { background: #ffe2a0; }
  </style>
