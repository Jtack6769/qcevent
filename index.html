<div class="wall-gallery" aria-label="Framed Star Trek picture gallery">
<div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 1"><img src="image_f769ad30.jpg" alt="Gallery picture 1" loading="lazy"><span class="missing-label"></span></div>
<div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 2"><img src="squire-of-gothos.jpg" alt="Gallery picture 2" loading="lazy"><span class="missing-label"></span></div>
<div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 3"><img src="trek-crew.jpg" alt="Gallery picture 3" loading="lazy"><span class="missing-label"></span></div>
<div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 4"><img src="gorn-poster.jpg" alt="Gallery picture 4" loading="lazy"><span class="missing-label"></span></div>
<div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 5"><img src="anniversary.png" alt="Gallery picture 5" loading="lazy"><span class="missing-label"></span></div>
<div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 6"><img src="uhura.jpg" alt="Gallery picture 6" loading="lazy"><span class="missing-label"></span></div>
<div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 7"><img src="harry-mudd.png" alt="Gallery picture 7" loading="lazy"><span class="missing-label"></span></div>
</div>
</main>
<dialog class="viewer" aria-label="Enlarged gallery picture"><button class="close" type="button">Close ×</button><img alt="Enlarged gallery picture"></dialog>
<script>
const upload=document.querySelector('#upload');
const bannerImage=document.querySelector('#banner-image');
const fallback=document.querySelector('#fallback');
const track=document.querySelector('#track');
let uploadedUrl=null;
function updateBanner(){fallback.hidden=bannerImage.complete&&bannerImage.naturalWidth>0;bannerImage.hidden=!fallback.hidden;}
bannerImage.addEventListener('load',updateBanner);
bannerImage.addEventListener('error',updateBanner);
updateBanner();
upload.addEventListener('change',()=>{const file=upload.files[0];if(!file)return;if(uploadedUrl)URL.revokeObjectURL(uploadedUrl);uploadedUrl=URL.createObjectURL(file);bannerImage.src=uploadedUrl;});
let paused=false;
document.querySelector('#repeat').addEventListener('click',e=>{paused=!paused;track.style.animationPlayState=paused?'paused':'running';e.target.textContent=paused?'Resume animation':'Pause animation';});
const viewer=document.querySelector('.viewer');
const enlargedImage=viewer.querySelector('img');
const closeButton=viewer.querySelector('.close');
let lastFrame=null;
document.querySelectorAll('.hanging-frame').forEach(frame=>{
 const photo=frame.querySelector('img');
 const showMissing=()=>{frame.classList.add('missing');frame.querySelector('.missing-label').textContent='Picture not found: '+photo.getAttribute('src');frame.removeAttribute('role');frame.removeAttribute('tabindex');frame.removeAttribute('aria-label');};
 photo.addEventListener('error',showMissing);
 if(photo.complete&&photo.naturalWidth===0)showMissing();
 const open=()=>{if(frame.classList.contains('missing'))return;lastFrame=frame;enlargedImage.src=photo.currentSrc||photo.src;enlargedImage.alt=photo.alt;viewer.showModal();closeButton.focus();};
 frame.addEventListener('click',open);
 frame.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
});
closeButton.addEventListener('click',()=>viewer.close());
viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close();});
viewer.addEventListener('close',()=>{enlargedImage.removeAttribute('src');if(lastFrame)lastFrame.focus();});
</script>
</body>
</html>
