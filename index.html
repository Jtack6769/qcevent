<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Button Example</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        .btn {
            text-decoration: none;
            display: inline-block;
            padding: 10px 20px;
            margin: 5px;
            background-color: #04AA6D; /* Green */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover { background-color: #038a58; }
        .disabled { background-color: #cccccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <h2>Current Step: <span id="step-number">1</span></h2>

    <div class="pagination">
        <button id="prevBtn" class="btn disabled" onclick="changeStep(-1)" disabled>Previous</button>
        <button id="nextBtn" class="btn" onclick="changeStep(1)">Next</button>
    </div>

    <script>
        let currentStep = 1;
        const maxSteps = 5;

        function changeStep(direction) {
            currentStep += direction;
            
            // Update the display text
            document.getElementById('step-number').innerText = currentStep;

            // Handle button states at the boundaries
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            // Previous Button logic
            if (currentStep === 1) {
                prevBtn.disabled = true;
                prevBtn.classList.add('disabled');
            } else {
                prevBtn.disabled = false;
                prevBtn.classList.remove('disabled');
            }

            // Next Button logic
            if (currentStep === maxSteps) {
                nextBtn.disabled = true;
                nextBtn.classList.add('disabled');
            } else {
                nextBtn.disabled = false;
                nextBtn.classList.remove('disabled');
            }
        }
    </script>
</body>
</html>
