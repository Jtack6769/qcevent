<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website with Background Wallpaper</title>
    <style>
        body {
            /* Replace the link below with your own image file name or web URL */
            background-image: url('creatos.jpg');
            
            /* Prevents the image from repeating like a tile grid */
            background-repeat: repeat;
            
            /* Centers the wallpaper both horizontally and vertically */
            background-position: 400px auto;
            
            /* Stretches the image to completely cover the screen without losing proportions */
            background-size: fit;
            
            /* Keeps the wallpaper fixed in place so it stays stationary when scrolling */
            background-attachment: auto;
            
            /* Ensures the page height stretches to fill the browser window */
            min-height: 100vh;
            margin: 0;
        }

        /* Styling for your site's content container to make text readable */
        .content-box {
            background-color: rgba(255, 255, 255, 0.9); /* White overlay with 90% opacity */
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<html lang="en">
