      <style>
    .image-container {
        display: inline-block;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none; /* For Safari */
        transition: transform 0.05s ease; /* Fast, snappy transition for a button click */
    }

    /* When clicked, it flips horizontally like a mirror image */
    .flipped {
        transform: scaleX(-1);

</style>

<!-- Your hidden easter egg button -->
<div class="image-container" id="flipImageContainer">
    <img id="myImage" src="your-image.png" alt="" width="150">
</div>

<script>
    let clickCount = 0;
    const imageContainer = document.getElementById('flipImageContainer');

    imageContainer.addEventListener('mousedown', () => {
        imageContainer.classList.add('flipped');
    });

    imageContainer.addEventListener('mouseup', () => {
        imageContainer.classList.remove('flipped');
        
        clickCount++;

        if (clickCount === 3) {
            // Put the secret treat website link here!
            window.open('https://google.com', '_blank');
            clickCount = 0; // Resets the counter so they can do it again later
        }
    });

    imageContainer.addEventListener('mouseleave', () => {
        imageContainer.classList.remove('flipped');
    });
</script>
