<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exploding Pumpkin | Quote Challenge</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#090608;color:#fff;font-family:Georgia,serif;padding:24px 12px 55px}
main{max-width:1000px;margin:auto;text-align:center}
h1{font-size:clamp(30px,6vw,60px);color:#bd1820;text-shadow:0 0 16px #7a0808;margin:8px 0 18px}
.pumpkin-stage{position:relative;width:100%;aspect-ratio:1536/838;overflow:hidden;border:5px ridge #ad7930;background:#080508;box-shadow:0 0 28px #6e1318;cursor:pointer;touch-action:manipulation}
.pumpkin-stage>img,.pumpkin-stage>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pumpkin-stage>img{object-fit:fill}
.pumpkin-stage>canvas{pointer-events:none}
.pumpkin-stage:focus-visible{outline:3px solid #ffcc66;outline-offset:4px}
.instructions{color:#f1c780;font:600 14px system-ui,sans-serif;letter-spacing:.08em;margin:14px 0 32px;text-transform:uppercase}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:22px 0}
.hanging-frame{border:0;padding:0;background:#1b1316;cursor:pointer;aspect-ratio:4/3;overflow:hidden;position:relative}
.hanging-frame img{width:100%;height:100%;object-fit:cover;display:block}
.hanging-frame:focus-visible{outline:3px solid #ffcc66}
.missing-label{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:12px;color:#e9c680;font:13px system-ui,sans-serif}
.hanging-frame.missing .missing-label{display:flex}
.hanging-frame.missing img{display:none}
.viewer{border:2px solid #b88a44;background:#080608;color:white;padding:45px 15px 15px;max-width:95vw;max-height:95vh}
.viewer::backdrop{background:rgba(0,0,0,.85)}
.viewer img{display:block;max-width:88vw;max-height:78vh;object-fit:contain}
.close{position:absolute;right:8px;top:7px;background:#4b141a;color:#fff;border:1px solid #d7a15e;padding:7px 12px;cursor:pointer}
@media(max-width:600px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}}
</style>
</head>
<body>
<main>
<h1>Happy Halloween!</h1>
<div class="pumpkin-stage" id="explosion-box" role="button" tabindex="0" aria-label="Explode the pumpkin">
  <img id="pumpkin-img" src="gemini_remix_20261030_162706.jpg" alt="Giant terrifying Halloween pumpkin">
  <canvas id="shatter" aria-hidden="true"></canvas>
</div>
<p class="instructions" id="instructions">Click the pumpkin to explode it!</p>
<div class="gallery" aria-label="Lunatic Fringe gallery">
  <button class="hanging-frame" type="button" aria-label="Enlarge gallery picture 1"><img src="gemini_remix_20261021_234409.jpg" alt="Gallery picture 1" loading="lazy"><span class="missing-label">Picture 1 not found</span></button>
  <button class="hanging-frame" type="button" aria-label="Enlarge gallery picture 2"><img src="gemini_remix_20261021_232243.jpg" alt="Gallery picture 2" loading="lazy"><span class="missing-label">Picture 2 not found</span></button>
  <button class="hanging-frame" type="button" aria-label="Enlarge gallery picture 3"><img src="image_eadaddeb.jpg" alt="Gallery picture 3" loading="lazy"><span class="missing-label">Picture 3 not found</span></button>
  <button class="hanging-frame" type="button" aria-label="Enlarge gallery picture 4"><img src="gemini_remix_20261021_232703.jpg" alt="Gallery picture 4" loading="lazy"><span class="missing-label">Picture 4 not found</span></button>
  <button class="hanging-frame" type="button" aria-label="Enlarge gallery picture 5"><img src="image_7e6db39.jpg" alt="Gallery picture 5" loading="lazy"><span class="missing-label">Picture 5 not found</span></button>
  <button class="hanging-frame" type="button" aria-label="Enlarge gallery picture 6"><img src="gemini_remix_20261030_162736.jpg" alt="Gallery picture 6" loading="lazy"><span class="missing-label">Picture 6 not found</span></button>
</div>
</main>
<dialog class="viewer" aria-label="Enlarged gallery picture"><button class="close" type="button" aria-label="Close enlarged picture">Close ×</button><img alt="Enlarged gallery picture"></dialog>
<script>

<script>
const pumpkin = document.createElement("img");

pumpkin.src = "gettyimages-2200044778-612x612.jpg";
pumpkin.alt = "Scary pumpkin";
pumpkin.title = "Click for a surprise!";

pumpkin.style.cssText = `
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 160px;
  max-width: 30vw;
  height: auto;
  cursor: pointer;
  z-index: 9999;
  border: none;
  transition: transform 0.3s ease;
`;

pumpkin.addEventListener("mouseenter", () => {
  pumpkin.style.transform = "scale(1.15)";
});

pumpkin.addEventListener("mouseleave", () => {
  pumpkin.style.transform = "scale(1)";
});

const pumpkinSound = new Audio("petergriffinstarwars.mp3");

pumpkin.addEventListener("click", () => {
  pumpkinSound.currentTime = 0;
  pumpkinSound.play().catch(error => {
    console.error("Pumpkin sound error:", error);
  });
});

document.body.appendChild(pumpkin);
</script>

</body>
</html>
