<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunatic Fringe - Quote Challenge</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0b0e;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: #141419;
            border: 2px solid #ff3366;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.3);
            padding: 30px;
            text-align: center;
            position: relative;
        }

        h1 {
            color: #ff3366;
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            margin-bottom: 20px;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        button {
            background: #ff3366;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: #ff1144;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Hidden audio stack area */
        #audio-stack {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lunatic Fringe</h1>
        <p>The system isn't loading, so we're stacking the tracks instead. Ready to trigger the alternate stream?</p>
        <button id="ignite-btn">Initialize Audio Stack</button>
    </div>

    <!-- MP3 Stack Placeholder -->
    <div id="audio-stack">
        <!-- Add your audio elements here -->
        <audio id="track1" src="audio1.mp3" preload="auto"></audio>
        <audio id="track2" src="audio2.mp3" preload="auto"></audio>
    </div>

    <script>
        const igniteBtn = document.getElementById('ignite-btn');
        const track1 = document.getElementById('track1');
        const track2 = document.getElementById('track2');

        igniteBtn.addEventListener('click', () => {
            // Stack and play audio nodes simultaneously
            if (track1 && track2) {
                track1.currentTime = 0;
                track2.currentTime = 0;
                track1.play().catch(e => console.log("Track 1 waiting for interaction"));
                track2.play().catch(e => console.log("Track 2 waiting for interaction"));
            }
            
            document.querySelector('.container').style.borderColor = '#33ccff';
            document.querySelector('h1').style.color = '#33ccff';
            document.querySelector('h1').innerText = 'Fringe Frequency Active';
            igniteBtn.style.background = '#33ccff';
            igniteBtn.innerText = 'Stack Running';
        });
    </script>

</body>
</html>
