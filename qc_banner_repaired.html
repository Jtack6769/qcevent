<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote Challenge 6.5 | Star Trek: The Original Series</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:28px 16px;color:#eee;font-family:Georgia,serif;background-color:#1a1512;background-image:linear-gradient(335deg,#110d0b 23px,transparent 23px),linear-gradient(155deg,#1d1815 23px,transparent 23px),linear-gradient(335deg,#110d0b 23px,transparent 23px),linear-gradient(155deg,#1d1815 23px,transparent 23px),linear-gradient(90deg,#0d0a08 10px,transparent 10px),linear-gradient(#0d0a08 10px,transparent 10px);background-size:58px 58px,58px 58px,58px 58px,58px 58px,29px 29px,29px 29px;background-position:0 2px,4px 35px,29px 31px,34px 6px,0 0}
.wrap{width:min(900px,100%);margin:0 auto 42px}.label{text-align:center;color:#e9c680;letter-spacing:.12em;font:13px system-ui;margin-bottom:14px}
.stage{position:relative;overflow:hidden;aspect-ratio:3.4/1;min-height:220px;border:9px ridge #ad7930;box-shadow:0 0 0 3px #ffe2a0,0 0 30px #bd6c16,inset 0 0 30px #000;background:#150f19}
.bulbs{position:absolute;inset:0;pointer-events:none;z-index:3;border:12px dotted #ffe4a2;filter:drop-shadow(0 0 6px #f7ac29)}
.track{height:100%;display:flex;width:200%;animation:rotate 24s ease-in-out infinite}.panel{flex:0 0 50%;height:100%;display:grid;place-items:center;position:relative;overflow:hidden;padding:18px;text-align:center}
.title{background:radial-gradient(ellipse,#42131a,#120b14 70%)}.title h1{margin:0;font-size:clamp(38px,8vw,90px);line-height:1.05;letter-spacing:.04em;color:#f3ce67;text-shadow:0 2px #4a2206,0 0 14px #f43d26,0 0 36px #b50c20}.title small{font:clamp(10px,1.6vw,19px) system-ui;letter-spacing:.25em;color:#fff0c0}
.poster{background:linear-gradient(135deg,#1a2844,#0a101c 60%,#48212a)}.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.poster-copy{position:relative;z-index:1;text-shadow:0 3px 10px #000,0 0 15px #000}.poster-copy strong{display:block;font-size:clamp(26px,6vw,65px);color:#ffdc91}.poster-copy span{font:clamp(12px,2vw,23px) system-ui}.poster-copy em{display:block;font-size:clamp(13px,2.4vw,25px);margin-top:8px;color:#d9efff}.poster-caption{font:12px/1.4 system-ui;color:#fff0c0;max-width:500px;margin:10px auto 0}
.controls{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:18px;font:14px system-ui}button{background:#ad792f;color:#100b0d;border:0;padding:9px 17px;border-radius:6px;cursor:pointer}input{max-width:100%;color:#f8deb0}
.wall-gallery{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:40px;max-width:1200px;margin:0 auto}.hanging-frame{position:relative;padding:12px 12px 14px;background:#111;border:8px ridge #4a3b2c;border-radius:4px;box-shadow:0 25px 35px #0009,0 5px 15px #000a;transform:rotate(var(--angle,0deg));transition:transform .3s ease;max-width:100%;cursor:zoom-in}.hanging-frame:nth-child(odd){--angle:-1.5deg}.hanging-frame:nth-child(even){--angle:1.8deg}.hanging-frame:nth-child(3n){--angle:-.7deg}.hanging-frame:hover,.hanging-frame:focus-visible{transform:rotate(0) scale(1.03);z-index:10}.hanging-frame:focus-visible{outline:3px solid #f5c76c;outline-offset:7px}.hanging-frame img{display:block;width:260px;max-width:100%;height:auto;min-height:180px;object-fit:contain;border:1px solid #050505;background:#000}.missing-label{display:none;padding:15px;max-width:260px;font:14px/1.5 system-ui;overflow-wrap:anywhere}.hanging-frame.missing{cursor:default}.hanging-frame.missing .missing-label{display:block}.hanging-frame.missing img{display:none}
dialog.viewer{border:8px ridge #4a3b2c;border-radius:5px;background:#101010;color:white;padding:15px;width:max-content;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);box-shadow:0 20px 50px #000}dialog.viewer::backdrop{background:#000e}.viewer img{display:block;max-width:min(88vw,1100px);max-height:76vh;object-fit:contain}.viewer .close{display:block;margin:0 0 12px auto;padding:7px 12px;background:#292019;border:1px solid #9f8868;color:#fff;font-size:17px;cursor:pointer}
@keyframes rotate{0%,38%{transform:translateX(0)}50%,88%{transform:translateX(-50%)}100%{transform:translateX(0)}}@media(max-width:600px){.wall-gallery{gap:28px}.hanging-frame img{width:min(260px,72vw)}}@media(prefers-reduced-motion:reduce){.track{animation:none}.hanging-frame{transition:none}}
</style>
</head>
<body>
<main>
<div class="wrap">
<div class="label">QUOTE CHALLENGE 6.5 · ENJOY STAR TREK: THE ORIGINAL SERIES</div>
<div class="stage" aria-label="Rotating Quote Challenge and Logan's Run banner">
<div class="track" id="track">
<section class="panel title"><div><h1>QUOTE<br>CHALLENGE</h1><small>THE MOVIE QUOTE GAME</small></div></section>
<section class="panel poster"><img id="banner-image" src="loganrun.jpg" alt="Logan's Run poster"><div class="poster-copy" id="fallback" hidden><span>EXCITING NEW ADVENTURES NEXT MONTH</span><strong>LOGAN'S RUN</strong><em>RUN FOR FREEDOM</em><p class="poster-caption">WATCH AS A SANDMAN TURNS RUNNER AND ESCAPES THE DOME CITY!</p></div></section>
</div><div class="bulbs"></div></div>
<div class="controls"><label>Choose banner image: <input type="file" id="upload" accept="image/*"></label><button type="button" id="repeat">Pause animation</button></div>
</div>
<div class="wall-gallery" aria-label="Framed Star Trek picture gallery">
<div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 1"><img src="image_f769ad30.jpg" alt="Gallery picture 1" loading="lazy"><span class="missing-label"></span></div>
<div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 2"><img src="squire-of-gothos.jpg" alt="Gallery picture 2" loading="lazy"><span class="missing-label"></span></div>
<div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 3"><img src="trek-crew.jpg" alt="Gallery picture 3" loading="lazy"><span class="missing-label"></span></div>
<div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 4"><img src="gorn-poster.jpg" alt="Gallery picture 4" loading="lazy"><span class="missing-label"></span></div>
<div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 5"><img src="anniversary.png" alt="Gallery picture 5" loading="lazy"><span class="missing-label"></span></div>
<div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 6"><img src="uhura.jpg" alt="Gallery picture 6" loading="lazy"><span class="missing-label"></span></div>
<div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 7"><img src="harry-mudd.png" alt="Gallery picture 7" loading="lazy"><span class="missing-label"></span></div>
</div>
</main>
<dialog class="viewer" aria-label="Enlarged gallery picture"><button class="close" type="button">Close ×</button><img alt="Enlarged gallery picture"></dialog>
<script>
const upload=document.querySelector('#upload');
const bannerImage=document.querySelector('#banner-image');
const fallback=document.querySelector('#fallback');
const track=document.querySelector('#track');
let uploadedUrl=null;
function updateBanner(){fallback.hidden=bannerImage.complete&&bannerImage.naturalWidth>0;bannerImage.hidden=!fallback.hidden;}
bannerImage.addEventListener('load',updateBanner);
bannerImage.addEventListener('error',updateBanner);
updateBanner();
upload.addEventListener('change',()=>{const file=upload.files[0];if(!file)return;if(uploadedUrl)URL.revokeObjectURL(uploadedUrl);uploadedUrl=URL.createObjectURL(file);bannerImage.src=uploadedUrl;});
let paused=false;
document.querySelector('#repeat').addEventListener('click',e=>{paused=!paused;track.style.animationPlayState=paused?'paused':'running';e.target.textContent=paused?'Resume animation':'Pause animation';});
const viewer=document.querySelector('.viewer');
const enlargedImage=viewer.querySelector('img');
const closeButton=viewer.querySelector('.close');
let lastFrame=null;
document.querySelectorAll('.hanging-frame').forEach(frame=>{
 const photo=frame.querySelector('img');
 const showMissing=()=>{frame.classList.add('missing');frame.querySelector('.missing-label').textContent='Picture not found: '+photo.getAttribute('src');frame.removeAttribute('role');frame.removeAttribute('tabindex');frame.removeAttribute('aria-label');};
 photo.addEventListener('error',showMissing);
 if(photo.complete&&photo.naturalWidth===0)showMissing();
 const open=()=>{if(frame.classList.contains('missing'))return;lastFrame=frame;enlargedImage.src=photo.currentSrc||photo.src;enlargedImage.alt=photo.alt;viewer.showModal();closeButton.focus();};
 frame.addEventListener('click',open);
 frame.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
});
closeButton.addEventListener('click',()=>viewer.close());
viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close();});
viewer.addEventListener('close',()=>{enlargedImage.removeAttribute('src');if(lastFrame)lastFrame.focus();});
</script>
</body>
</html>
