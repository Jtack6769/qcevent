              Show / Movie</label>
              <input id="showAnswer" placeholder="e.g., The Wizard of Oz" autocomplete="off">
            </div>
            <div>
              <label for="yearAnswer">Year (Optional)</label>
              <input id="yearAnswer" type="number" placeholder="e.g., 1939" min="1880" max="2030">
            </div>
          </div>
          <div class="actions">
            <button onclick="submitHumanAnswer()">SUBMIT ANSWER</button>
            <button class="secondary" onclick="giveUpCurrentTurn()">GIVE UP</button>
          </div>
        </div>
        <div id="feedbackArea" class="feedback hidden">
          <div id="feedbackText"></div>
          <div id="answerKey" class="answerkey hidden"></div>
          <button class="wide" id="nextTurnBtn" onclick="advanceGameTurn()">CONTINUE</button>
        </div>
      </section>
    </section>

    <footer class="footer">
      <details>
        <summary>Game Rules & Information</summary>
        <p><strong>New Rules:</strong> First to reach target score wins. Correct answers reward points based on difficulty, while incorrect choices or expired timers penalize your score.</p>
        <p><strong>Classic Rules:</strong> Fixed rounds. Highest score at the end of the total allotted turns takes the match.</p>
      </details>
    </footer>
  </main>
</body>
</html>
