```html
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spooky Halloween | Quote Challenge 6.5</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      background: #020103; 
      color: #fff; 
      font-family: Georgia, serif; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .halloween-container {
      position: relative;
      width: min(900px, 95%);
      text-align: center;
    }
    .halloween-title {
      font-size: clamp(32px, 6vw, 64px);
      color: #b50c20;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px #000, 0 0 15px rgba(181, 12, 32, 0.8);
      /* Simulating the dripping blood look with text effects */
      background: linear-gradient(to bottom, #ff3333 40%, #8b0000 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .pumpkin-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border: 6px ridge #ad7930;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(181, 12, 32, 0.5);
      cursor: pointer;
    }
    .pumpkin-stage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease, filter 0.3s ease;
    }
    .pumpkin-stage:hover img {
      transform: scale(1.02);
      filter: brightness(1.1);
    }
    .instructions {
      font-family: system-ui, sans-serif;
      font-size: 14px;
      color: #e9c680;
      margin-top: 15px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="halloween-container">
    <div class="halloween-title">Happy Halloween!</div>
    
    <div class="pumpkin-stage" id="explosion-box" onclick="triggerExplosion()">
      <img id="pumpkin-img" src="image_5.png" alt="Scary Jack-o-Lantern Holding Bill">
    </div>
    
    <div class="instructions">[ Click the pumpkin to detonate ]</div>
  </div>

  <script>
    function triggerExplosion() {
      const imgElement = document.getElementById('pumpkin-img');
      const box = document.getElementById('explosion-box');
      
      // Flash effect before "blowing up"
      box.style.boxShadow = "0 0 80px #ff3333, inset 0 0 50px #fff";
      imgElement.style.filter = "brightness(2) contrast(2) saturate(2)";
      imgElement.style.transform = "scale(1.1)";

      setTimeout(() => {
        // Swap to your explosion or black screen state after 300ms
        box.style.background = "#ff3333";
        imgElement.style.display = "none";
        
        // Optional: Redirect or reset after explosion
        setTimeout(() => {
          alert("BOOM! Happy Halloween!");
          location.reload();
        }, 400);
      }, 300);
    }
  </script>

</body>
</html>
